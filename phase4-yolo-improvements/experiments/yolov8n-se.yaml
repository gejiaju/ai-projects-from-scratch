# YOLOv8n + SE 注意力（把原始 C2f 全部替换为 C2fSE）
# 用法：run_ablation.py 会自动注册 C2fSE 模块后加载本配置
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fSE, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fSE, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fSE, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fSE, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2fSE, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2fSE, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2fSE, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2fSE, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]
